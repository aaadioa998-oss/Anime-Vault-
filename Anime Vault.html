<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anime Vault</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Layout: sticky search header, genre chip rail, poster grid (2 cols on phone), bottom-sheet detail; owner-only add/edit tools */
:root{
  --bg:#f3f1f8; --surface:#ffffff; --surface-2:#e9e6f3; --fg:#1c1838; --muted:#6a6590;
  --line:#d9d4ea; --accent:#e5195f; --accent-fg:#ffffff; --focus:#3a2fd6; --danger:#c4261d;
  --on-poster:#ffffff;
  --display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12102a; --surface:#1c1940; --surface-2:#27235a; --fg:#efecff; --muted:#a29dd0;
  --line:#35306f; --accent:#ff4d8d; --accent-fg:#1a0710; --focus:#9a92ff; --danger:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12102a; --surface:#1c1940; --surface-2:#27235a; --fg:#efecff; --muted:#a29dd0;
  --line:#35306f; --accent:#ff4d8d; --accent-fg:#1a0710; --focus:#9a92ff; --danger:#ff7b72; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1100px;margin:0 auto}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:grid;gap:12px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-size:1.5rem;letter-spacing:.01em;line-height:1}
.logo small{display:block;font-family:var(--jp);font-weight:700;font-size:.7rem;letter-spacing:.35em;color:var(--accent);margin-top:4px}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:0 16px;height:50px}
.search:focus-within{border-color:var(--focus)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search input::placeholder{color:var(--muted)}
.search button{background:none;border:0;color:var(--muted);display:grid;place-items:center;padding:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.rail{display:flex;gap:8px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-block:6px 14px}
.bar .count{margin-right:auto;color:var(--muted);font-variant-numeric:tabular-nums}
select{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:8px;min-width:0}
.card:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:14px}
.poster{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:14px;overflow:hidden;color:var(--on-poster);
  background:linear-gradient(160deg,hsl(var(--h) 78% 52%),hsl(calc(var(--h) + 45) 70% 28%));isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.28;
  background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.55) 14px 15px)}
.poster .jp{position:absolute;right:10px;top:10px;bottom:10px;writing-mode:vertical-rl;font-family:var(--jp);font-weight:900;
  font-size:clamp(1.4rem,6vw,2rem);letter-spacing:.12em;text-shadow:0 2px 0 rgba(0,0,0,.25);overflow:hidden}
.poster .ini{position:absolute;left:10px;bottom:6px;font-family:var(--display);font-size:clamp(2.4rem,9vw,3.4rem);line-height:1;opacity:.95}
.badge{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;background:rgba(10,8,30,.62);color:#fff;
  border-radius:999px;padding:3px 9px;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.badge svg{fill:#ffd23f;stroke:#ffd23f}
.fav{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(10,8,30,.62);color:#fff;display:grid;place-items:center}
.fav[aria-pressed="true"] svg{fill:#ff4d8d;stroke:#ff4d8d}
.card h3{margin:0;font-size:.95rem;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.card p{margin:0;color:var(--muted);font-size:.82rem}
.empty{border:2px dashed var(--line);border-radius:16px;padding:36px 20px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty strong{color:var(--fg);font-family:var(--display);font-weight:400;font-size:1.2rem}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,6,24,.66);display:grid;align-items:end;justify-items:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;
  padding:20px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet-top{display:flex;gap:14px;align-items:flex-start}
.sheet-top .poster{width:110px;flex:none}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.15;overflow-wrap:anywhere}
.sheet .jpt{font-family:var(--jp);font-weight:700;color:var(--accent);margin-top:4px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.meta div{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.meta dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface-2);border-radius:999px;padding:3px 11px;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:10px}
.x{margin-left:auto;background:var(--surface);border:2px solid var(--line);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}

form{display:grid;gap:12px}
label{display:grid;gap:5px;font-weight:600;font-size:.85rem}
label small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],textarea,.f select{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{margin:0;color:var(--muted);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:600;max-width:90%}
@media (prefers-reduced-motion:no-preference){.card .poster{transition:transform .18s}.card:hover .poster{transform:translateY(-3px)}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">ANIME VAULT<small>アニメ図鑑</small></div>
      <button class="btn primary" id="addBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add anime</button>
    </div>
    <div class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" inputmode="search" autocomplete="off" placeholder="Search title, genre or studio" aria-label="Search anime">
      <button id="clear" hidden aria-label="Clear search"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="rail" id="genres" role="group" aria-label="Genres"></div>
  </header>

  <div class="bar">
    <span class="count" id="count" aria-live="polite"></span>
    <button class="btn" id="favOnly" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 6.8 5c2 0 3.5 1.2 5.2 3 1.7-1.8 3.2-3 5.2-3 3.500 0 5.600 3.600 4.300 6.800C19.500 16.400 12 21 12 21z"/></svg>Favourites</button>
    <label class="f" style="display:contents"><span hidden>Status</span>
      <select id="status" aria-label="Status"><option>All</option><option>Ongoing</option><option>Completed</option></select></label>
    <select id="sort" aria-label="Sort by">
      <option value="rating">Top rated</option><option value="year">Newest</option><option value="title">A to Z</option>
    </select>
  </div>

  <main id="grid" class="grid" aria-label="Anime list"></main>
</div>
<div id="layer"></div>

<script>
const ICON={
  star:'<svg class="i" viewBox="0 0 24 24"><path d="m12 3 2.7 5.600 6.100.8-4.500 4.300 1.100 6.100L12 16.800 6.600 19.800l1.100-6.100L3.200 9.400l6.100-.8z"/></svg>',
  heart:'<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.200 8.600 3.300 5 6.800 5c2 0 3.500 1.200 5.200 3 1.700-1.800 3.200-3 5.200-3 3.500 0 5.600 3.600 4.300 6.800C19.500 16.400 12 21 12 21z"/></svg>',
  x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  edit:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>'
};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],canEdit=false,db=null,favs=new Set(),loaded=false,timedOut=false;
const S={q:'',genre:'All',status:'All',sort:'rating',fav:false};
try{favs=new Set(JSON.parse(localStorage.getItem('av-favs')||'[]'))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem('av-favs',JSON.stringify([...favs]))}catch(e){}};

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

function poster(a,extra=''){
  const ini=(a.title||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<div class="poster" style="--h:${Number(a.hue)||260}">
    <span class="jp" lang="ja">${esc(a.jp||'')}</span><span class="ini">${esc(ini)}</span>${extra}</div>`;
}

function filtered(){
  const q=S.q.trim().toLowerCase();
  let r=items.filter(a=>{
    if(S.genre!=='All'&&!(a.genres||[]).includes(S.genre))return false;
    if(S.status!=='All'&&a.status!==S.status)return false;
    if(S.fav&&!favs.has(a.id))return false;
    if(!q)return true;
    return [a.title,a.jp,a.studio,(a.genres||[]).join(' ')].join(' ').toLowerCase().includes(q);
  });
  const by={rating:(x,y)=>(y.rating||0)-(x.rating||0),year:(x,y)=>(y.year||0)-(x.year||0),title:(x,y)=>String(x.title).localeCompare(y.title)};
  return r.sort(by[S.sort]);
}

function renderGenres(){
  const all=['All',...[...new Set(items.flatMap(a=>a.genres||[]))].sort()];
  if(!all.includes(S.genre))S.genre='All';
  $('#genres').innerHTML=all.map(g=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${g===S.genre}">${esc(g)}</button>`).join('');
}

function render(){
  const list=filtered();
  $('#count').textContent=loaded?`${list.length} anime`:'';
  const g=$('#grid');
  if(!loaded){
    g.innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>${timedOut?'Could not load the list':'Loading the vault'}</strong>
      <span>${timedOut?'Open this page signed in to claude.ai and try again.':'Fetching anime...'}</span></div>`;return}
  if(!items.length){
    g.innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>Vault is empty</strong>
      <span>${canEdit?'Tap "Add anime" to add your first title.':'No anime have been added yet.'}</span></div>`;return}
  if(!list.length){
    g.innerHTML=`<div class="empty" style="grid-column:1/-1"><strong>Nothing found</strong><span>Try another word or clear the filters.</span></div>`;return}
  g.innerHTML=list.map(a=>`<div style="min-width:0"><button class="card" data-id="${esc(a.id)}" aria-label="${esc(a.title)}">
    ${poster(a,`${a.rating?`<span class="badge">${ICON.star}${Number(a.rating).toFixed(1)}</span>`:''}`)}
    <h3>${esc(a.title)}</h3><p>${esc(a.year||'')} · ${esc(a.status||'')}</p></button></div>`).join('');
}

function openDetail(id){
  const a=items.find(x=>x.id===id);if(!a)return;
  const isFav=favs.has(id);
  sheet(`<div class="sheet-top">${poster(a)}<div style="min-width:0">
      <h2>${esc(a.title)}</h2><div class="jpt" lang="ja">${esc(a.jp||'')}</div>
      <div class="tags" style="margin-top:10px">${(a.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join('')}</div></div>
      <button class="x" data-close aria-label="Close">${ICON.x}</button></div>
    <dl class="meta" style="margin:0">
      <div><dt>Rating</dt><dd>${a.rating?Number(a.rating).toFixed(1)+' / 10':'Not rated'}</dd></div>
      <div><dt>Year</dt><dd>${esc(a.year||'-')}</dd></div>
      <div><dt>Episodes</dt><dd>${esc(a.episodes||'-')}</dd></div>
      <div><dt>Status</dt><dd>${esc(a.status||'-')}</dd></div>
      <div><dt>Studio</dt><dd>${esc(a.studio||'-')}</dd></div></dl>
    <p style="margin:0">${esc(a.desc||'')}</p>
    <div class="row">
      <button class="btn" data-fav="${esc(id)}" aria-pressed="${isFav}">${ICON.heart}${isFav?'In favourites':'Add to favourites'}</button>
      ${canEdit?`<button class="btn" data-edit="${esc(id)}">${ICON.edit}Edit</button>
      <button class="btn danger" data-del="${esc(id)}">${ICON.trash}Delete</button>`:''}</div>`);
}

function sheet(html){
  $('#layer').innerHTML=`<div class="scrim" data-close-bg><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const f=$('#layer').querySelector('button,input');if(f)f.focus();
}
const closeSheet=()=>{$('#layer').innerHTML=''};

const GENRES=['Action','Adventure','Comedy','Drama','Fantasy','Horror','Mystery','Romance','Sci-Fi','Slice of Life','Sports','Supernatural','Thriller','Shounen','Seinen'];
function openForm(id){
  const a=items.find(x=>x.id===id)||{title:'',jp:'',genres:[],year:new Date().getFullYear(),episodes:12,rating:8,status:'Completed',studio:'',desc:'',hue:Math.floor(Math.random()*360)};
  sheet(`<div class="sheet-top"><h2>${id?'Edit anime':'Add anime'}</h2><button class="x" data-close aria-label="Close">${ICON.x}</button></div>
  <form id="f" class="f">
    <label>Title<input type="text" name="title" required value="${esc(a.title)}"></label>
    <label>Japanese title <small>shown on the poster, optional</small><input type="text" name="jp" value="${esc(a.jp)}" lang="ja"></label>
    <label>Genres <small>separate with commas. Examples: ${GENRES.slice(0,6).join(', ')}</small><input type="text" name="genres" value="${esc((a.genres||[]).join(', '))}"></label>
    <div class="two">
      <label>Year<input type="number" name="year" value="${esc(a.year)}" min="1950" max="2100"></label>
      <label>Episodes<input type="number" name="episodes" value="${esc(a.episodes)}" min="0"></label>
      <label>Status<select name="status"><option${a.status==='Completed'?' selected':''}>Completed</option><option${a.status==='Ongoing'?' selected':''}>Ongoing</option></select></label>
    </div>
    <label>Studio<input type="text" name="studio" value="${esc(a.studio)}"></label>
    <label>Rating: <span id="rv">${Number(a.rating||0).toFixed(1)}</span><input type="range" name="rating" min="0" max="10" step="0.1" value="${a.rating||0}"></label>
    <label>Poster colour<input type="range" name="hue" min="0" max="360" value="${a.hue||260}"></label>
    <label>Story<textarea name="desc">${esc(a.desc)}</textarea></label>
    <div class="row"><button class="btn primary" type="submit">Save</button><button class="btn" type="button" data-close>Cancel</button></div>
    <p class="note">Saved changes show up for everyone who opens the site.</p>
  </form>`);
  const f=$('#f');
  f.rating.addEventListener('input',()=>{$('#rv').textContent=Number(f.rating.value).toFixed(1)});
  f.addEventListener('submit',async e=>{
    e.preventDefault();
    const d=Object.fromEntries(new FormData(f));
    const data={title:d.title.trim(),jp:d.jp.trim(),genres:d.genres.split(',').map(s=>s.trim()).filter(Boolean),
      year:+d.year||0,episodes:+d.episodes||0,status:d.status,studio:d.studio.trim(),rating:+d.rating||0,hue:+d.hue||0,desc:d.desc.trim()};
    try{
      if(id)await db.collection('anime').doc(id).set(data);
      else await db.collection('anime').add(data);
      closeSheet();toast('Saved');
    }catch(err){toast('Could not save. Check you are signed in as the owner.')}
  });
}

function confirmDelete(id){
  const a=items.find(x=>x.id===id);
  sheet(`<h2>Delete ${esc(a.title)}?</h2><p style="margin:0">This removes it from the site for everyone.</p>
    <div class="row"><button class="btn danger" data-del-yes="${esc(id)}">Yes, delete</button><button class="btn" data-close>Keep it</button></div>`);
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-close-bg]');if(!t)return;
  if(t.dataset.closeBg!==undefined&&e.target!==t)return;
  if(t.dataset.closeBg!==undefined||t.hasAttribute('data-close'))return closeSheet();
  if(t.dataset.g){S.genre=t.dataset.g;renderGenres();return render()}
  if(t.id==='clear'){$('#q').value='';S.q='';$('#clear').hidden=true;return render()}
  if(t.id==='favOnly'){S.fav=!S.fav;t.setAttribute('aria-pressed',S.fav);return render()}
  if(t.id==='addBtn')return openForm();
  if(t.dataset.fav){const id=t.dataset.fav;favs.has(id)?favs.delete(id):favs.add(id);saveFavs();openDetail(id);return render()}
  if(t.dataset.edit)return openForm(t.dataset.edit);
  if(t.dataset.del)return confirmDelete(t.dataset.del);
  if(t.dataset.delYes){try{await db.collection('anime').doc(t.dataset.delYes).delete();closeSheet();toast('Deleted')}catch(err){toast('Could not delete')}return}
  if(t.classList.contains('card'))return openDetail(t.dataset.id);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#q').addEventListener('input',e=>{S.q=e.target.value;$('#clear').hidden=!S.q;render()});
$('#status').addEventListener('change',e=>{S.status=e.target.value;render()});
$('#sort').addEventListener('change',e=>{S.sort=e.target.value;render()});

renderGenres();render();
(async()=>{
  const timer=setTimeout(()=>{if(!loaded){timedOut=true;render()}},10000);
  try{
    const u=window.claude?.use?await claude.use('user'):null;
    canEdit=u?!!(await u.canEdit()):false;
    $('#addBtn').hidden=!canEdit;
    db=window.claude?.use?await claude.use('db'):null;
    if(!db){timedOut=true;render();return}
    db.collection('anime').onSnapshot(snap=>{
      clearTimeout(timer);timedOut=false;loaded=true;
      items=snap.docs.map(d=>({id:d.id,...d.data()}));
      renderGenres();render();
    },()=>{timedOut=true;render()});
  }catch(e){timedOut=true;render()}
})();
</script>
